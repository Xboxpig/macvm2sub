name: Test
on: [push, pull_request]
jobs:
  gateway-and-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm --prefix console ci
      - run: npm run build:web
