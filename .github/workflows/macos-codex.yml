name: macOS Codex CLI

on:
  push:
    branches: [main, feat/macos-x64-codex]
  pull_request:

permissions:
  contents: read

jobs:
  native-codex:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --global @openai/codex@0.160.0
      - run: npx biome format
      - name: Codex protocol and native adapter tests
        run: node --test test/unit/codex-*.test.mjs test/unit/handle-codex.test.mjs
        env:
          KIN_CODEX_BACKEND: kernel
      - name: Real official CLI and loopback provider
        run: node --test test/e2e/codex-cli-native.e2e.test.mjs
        env:
          VM2API_TEST_CODEX_CLI: '1'
